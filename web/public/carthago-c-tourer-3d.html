<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carthago c-tourer I 148 RB QB L comfort – 3D</title>
<style>
  html,body{margin:0;height:100%;background:#e9edf1;font-family:system-ui,sans-serif}
  #wrap{position:relative;width:100%;height:100%}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  #ui{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px}
  button{border:0;border-radius:8px;padding:8px 12px;background:#fff;color:#222;font-size:14px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  button:hover{background:#f1f5f9}
  #tip{position:absolute;top:12px;left:12px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.9);font-size:14px;color:#222}
</style>
</head>
<body>
<div id="wrap">
  <div id="tip">Ziehen = drehen · Klappe anklicken = öffnen</div>
  <div id="ui">
    <button data-v="l">Links</button><button data-v="r">Rechts</button>
    <button data-v="f">Vorne</button><button data-v="b">Hinten</button>
    <button id="all">Alle Klappen auf/zu</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Koordinaten in Metern: Front = +x, rechte Seite (Beifahrer/Eingang) = +z, linke Seite = -z
const wrap = document.getElementById('wrap'), tip = document.getElementById('tip');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9edf1);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
wrap.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x8899aa,0.9));
const sun = new THREE.DirectionalLight(0xffffff,0.8); sun.position.set(5,8,6); scene.add(sun);

const ground = new THREE.Mesh(new THREE.CircleGeometry(9,48), new THREE.MeshBasicMaterial({color:0xd5dbe1}));
ground.rotation.x=-Math.PI/2; scene.add(ground);

const W = 2.3, H = 1.15;
const std = c => new THREE.MeshStandardMaterial({color:c, roughness:.6});
const van = new THREE.Group(); scene.add(van);

// Karosserie: Seitenprofil extrudiert über die Breite
const p = new THREE.Shape();
[[-3.7,0.45],[-3.7,2.9],[-3.6,3.0],[1.7,3.0],[2.75,2.95],[2.95,2.4],[3.3,1.3],[3.55,1.1],[3.55,0.5],[3.3,0.4]]
  .forEach((q,i)=> i? p.lineTo(q[0],q[1]) : p.moveTo(q[0],q[1]));
const bodyGeo = new THREE.ExtrudeGeometry(p,{depth:W,bevelEnabled:false});
bodyGeo.translate(0,0,-H);
van.add(new THREE.Mesh(bodyGeo, std(0xf4f5f6)));

// Frontscheibe
const ws = new THREE.Mesh(new THREE.PlaneGeometry(1.15,2.0).rotateX(-Math.PI/2),
  new THREE.MeshStandardMaterial({color:0x1d2630,roughness:.2,side:THREE.DoubleSide}));
ws.position.set(3.125+0.011,1.85+0.004,0); ws.rotation.z=Math.atan2(-1.1,0.35); van.add(ws);

// Räder
const tire = std(0x1a1a1a), rim = std(0x555b61);
[[2.6],[-1.55]].forEach(([x])=>[1,-1].forEach(s=>{
  const t = new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.3,28).rotateX(Math.PI/2),tire);
  t.position.set(x,.38,s*.95); van.add(t);
  const r = new THREE.Mesh(new THREE.CylinderGeometry(.24,.24,.31,20).rotateX(Math.PI/2),rim);
  r.position.copy(t.position); van.add(r);
}));

// Fenster (dunkel) und Rückleuchten
const glass = new THREE.MeshStandardMaterial({color:0x222b35,roughness:.2});
function box(w,h,d,x,y,z,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);van.add(m);return m;}
[1,-1].forEach(s=>{
  box(1.3,.85,.02,2.2,2.0,s*(H+.005),glass);   // Fahrerhaus
  box(1.3,.6,.02,-1.9,2.2,s*(H+.005),glass);   // Wohnraum
  box(.7,.5,.02,-0.7,2.2,s*(H+.005),glass);
  box(.12,.45,.05,-3.7,.95,s*.9,std(0xc0272d)); // Rücklicht
});
box(.06,.25,1.6,-3.72,2.8,0,std(0x888e94));

// Türen (kein Stauraum, nur grau angedeutet, nicht klickbar)
const doorMat = std(0xb9c3cc);
box(.72,2.05,.03,.35,1.72,H+.005,doorMat);   // Eingangstür rechts
box(.72,2.05,.03,.35,1.72,-H-.005,doorMat);  // Fahrertür links

// Klappen (Stauraum) – am oberen Rand angeschlagen, klickbar
const flaps = [];
function flap(name,x,yc,w,h,side,color){
  const pivot = new THREE.Group();
  pivot.position.set(x,yc+h/2,side*H);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,.05), std(color));
  m.position.set(0,-h/2,side*.015);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:0x222222}));
  m.add(e);
  const handle = new THREE.Mesh(new THREE.BoxGeometry(.05,.1,.03),std(0x111111));
  handle.position.set(w/2-.1,0,side*.04); m.add(handle);
  pivot.add(m); van.add(pivot);
  m.userData={name,pivot,side,open:false,angle:0};
  flaps.push(m);
}
const GARAGE=0xe8833a, STAU=0x2a9d8f;
// Rechte Seite
flap('Garage rechts',-3.2,1.1,1.0,1.25,1,GARAGE);
flap('Staufach rechts neben der Tür',1.0,.95,.55,.5,1,STAU);
flap('Staufach unten links neben der Tür',-.6,.7,.58,.24,1,STAU);
// Linke Seite
flap('Garage links',-3.2,1.1,1.0,1.25,-1,GARAGE);
flap('Staufach links (hinter Fahrertür)',-.45,.95,.5,.65,-1,STAU);

// Orbit-Steuerung
const target = new THREE.Vector3(0,1.4,0);
let th=Math.PI/2+.5, ph=.3, rad=13, thT=th, phT=ph, auto=true;
const views={l:-Math.PI/2,r:Math.PI/2,f:0,b:Math.PI};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{auto=false;phT=.12;
  let t=views[b.dataset.v]; thT=th+Math.atan2(Math.sin(t-th),Math.cos(t-th));});
document.getElementById('all').onclick=()=>{const o=flaps.some(f=>!f.userData.open);flaps.forEach(f=>f.userData.open=o);};
let drag=null,moved=0;
const el=renderer.domElement, ray=new THREE.Raycaster(), mp=new THREE.Vector2();
el.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};moved=0;auto=false;el.setPointerCapture(e.pointerId);el.style.cursor='grabbing';});
el.addEventListener('pointerup',e=>{el.style.cursor='grab';
  if(moved<5){const f=pick(e);if(f)f.userData.open=!f.userData.open;} drag=null;});
el.addEventListener('pointermove',e=>{
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved+=Math.abs(dx)+Math.abs(dy);
    thT-=dx*.008;th=thT;phT=Math.max(.02,Math.min(1.3,phT+dy*.006));ph=phT;drag={x:e.clientX,y:e.clientY};}
  else{const f=pick(e);tip.textContent=f?f.userData.name+' – klicken zum Öffnen':'Ziehen = drehen · Klappe anklicken = öffnen';}
});
el.addEventListener('wheel',e=>{e.preventDefault();rad=Math.max(7,Math.min(20,rad+e.deltaY*.01));},{passive:false});
function pick(e){const r=el.getBoundingClientRect();
  mp.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mp,camera);const h=ray.intersectObjects(flaps,false);return h.length?h[0].object:null;}

function resize(){const w=wrap.clientWidth,h=wrap.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

(function loop(){
  requestAnimationFrame(loop);
  if(auto){thT+=.004;}
  th+=(thT-th)*.1; ph+=(phT-ph)*.1;
  camera.position.set(target.x+rad*Math.cos(ph)*Math.cos(th),target.y+rad*Math.sin(ph),target.z+rad*Math.cos(ph)*Math.sin(th));
  camera.lookAt(target);
  flaps.forEach(f=>{const u=f.userData,goal=u.open?1.2:0;u.angle+=(goal-u.angle)*.12;u.pivot.rotation.x=-u.side*u.angle;});
  renderer.render(scene,camera);
})();
</script>
</body>
</html>
